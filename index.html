<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grocery Barcode App</title>
<style>
body{margin:0;font-family:Arial;background:#f3f4f6}
header{background:#168a45;color:white;text-align:center;padding:18px}
main{max-width:600px;margin:auto;padding:15px}
.card{background:white;padding:16px;margin-bottom:15px;border-radius:14px;box-shadow:0 2px 8px #ddd}
input,button{width:100%;padding:13px;margin-top:9px;border-radius:9px;font-size:16px;box-sizing:border-box}
input{border:1px solid #ccc}
button{border:0;background:#168a45;color:white;font-weight:bold}
.scan{background:#1769aa}
.delete{background:#d93025}
video{width:100%;margin-top:10px;border-radius:10px;display:none}
img{max-width:180px;max-height:180px;border-radius:12px}
.center{text-align:center}
.price{font-size:25px;color:#168a45;font-weight:bold}
</style>
</head>

<body>

<header>
<h1>🛒 Grocery Barcode</h1>
</header>

<main>

<div class="card">
<h2>📷 বারকোড স্ক্যান</h2>

<button class="scan" onclick="scanBarcode()">
📷 বারকোড স্ক্যান করুন
</button>

<video id="video" autoplay playsinline></video>

<p>স্ক্যান করা বারকোড:</p>
<b id="code">কোনো কোড নেই</b>
</div>


<div class="card">
<h2>➕ নতুন প্রোডাক্ট</h2>

<input id="barcode" placeholder="বারকোড">

<input id="name" placeholder="প্রোডাক্টের নাম">

<input id="price" type="number" placeholder="দাম">

<input id="photo" type="file" accept="image/*">

<button onclick="saveProduct()">
💾 প্রোডাক্ট সেভ করুন
</button>
</div>


<div class="card">
<h2>🔎 বারকোড দিয়ে খুঁজুন</h2>

<input id="search" placeholder="বারকোড লিখুন">

<button onclick="findProduct()">
🔍 খুঁজুন
</button>
</div>


<div id="result"></div>

</main>


<script src="https://unpkg.com/@zxing/browser@latest"></script>

<script>

let products =
JSON.parse(localStorage.getItem("products") || "[]");

let photoData = "";

let reader = null;
let controls = null;


/* ছবি নেওয়া */

document.getElementById("photo").onchange = function(e){

let file = e.target.files[0];

if(!file) return;

let r = new FileReader();

r.onload = function(){
photoData = r.result;
};

r.readAsDataURL(file);

};


/* বারকোড স্ক্যান */

async function scanBarcode(){

let video = document.getElementById("video");

video.style.display = "block";

try{

reader = new ZXingBrowser.BrowserMultiFormatReader();

controls =
await reader.decodeFromVideoDevice(
undefined,
video,
(result,error)=>{

if(result){

let code = result.getText();

document.getElementById("code").innerText = code;

document.getElementById("barcode").value = code;

document.getElementById("search").value = code;

stopScanner();

findProduct();

}

});

}catch(e){

alert("ক্যামেরা চালু করা যায়নি। ক্যামেরার অনুমতি দিন।");

}

}


/* স্ক্যান বন্ধ */

function stopScanner(){

if(controls){

controls.stop();

controls = null;

}

document.getElementById("video").style.display="none";

}


/* প্রোডাক্ট সেভ */

function saveProduct(){

let barcode =
document.getElementById("barcode").value.trim();

let name =
document.getElementById("name").value.trim();

let price =
document.getElementById("price").value.trim();


if(!barcode){
alert("আগে বারকোড স্ক্যান করুন");
return;
}

if(!name){
alert("প্রোডাক্টের নাম লিখুন");
return;
}

if(!price){
alert("দাম লিখুন");
return;
}


let product = {
barcode:barcode,
name:name,
price:price,
photo:photoData
};


let index =
products.findIndex(
p => p.barcode === barcode
);


if(index >= 0){

products[index] = product;

}else{

products.push(product);

}


localStorage.setItem(
"products",
JSON.stringify(products)
);


alert("✅ প্রোডাক্ট সেভ হয়েছে");

showProduct(product);

}


/* প্রোডাক্ট খোঁজা */

function findProduct(){

let barcode =
document.getElementById("search").value.trim();


if(!barcode){

alert("বারকোড স্ক্যান করুন বা লিখুন");

return;

}


let product =
products.find(
p => p.barcode === barcode
);


if(!product){

document.getElementById("result").innerHTML = `

<div class="card center">

<h2>❌ প্রোডাক্ট পাওয়া যায়নি</h2>

<p>
এই বারকোডের কোনো প্রোডাক্ট এখনো সেভ করা হয়নি।
</p>

</div>

`;

return;

}


showProduct(product);

}


/* প্রোডাক্ট দেখানো */

function showProduct(product){

document.getElementById("result").innerHTML = `

<div class="card center">

<h2>✅ প্রোডাক্ট পাওয়া গেছে</h2>

${
product.photo
?
`<img src="${product.photo}">`
:
`<div style="font-size:80px">🛒</div>`
}

<h2>${safe(product.name)}</h2>

<div class="price">
💰 ${safe(product.price)}
</div>

<p>
🔢 বারকোড: ${safe(product.barcode)}
</p>

<button class="delete"
onclick="deleteProduct('${safe(product.barcode)}')">
🗑️ প্রোডাক্ট মুছুন
</button>

</div>

`;

}


/* প্রোডাক্ট মুছা */

function deleteProduct(barcode){

if(!confirm("এই প্রোডাক্ট মুছে ফেলবেন?"))
return;

products =
products.filter(
p => p.barcode !== barcode
);

localStorage.setItem(
"products",
JSON.stringify(products)
);

document.getElementById("result").innerHTML="";

}


/* নিরাপদ লেখা */

function safe(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
