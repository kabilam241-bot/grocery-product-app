<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>গ্রোসারি বারকোড অ্যাপ</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f5f3;
    color:#222;
}

header{
    background:#168a45;
    color:white;
    text-align:center;
    padding:18px 10px;
}

header h1{
    margin:0;
    font-size:24px;
}

main{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.10);
}

h2{
    margin-top:0;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:5px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:8px;
    background:#168a45;
    color:white;
    font-size:17px;
}

.scan-btn{
    background:#1769aa;
}

.delete{
    background:#d93025;
}

.product img{
    width:100%;
    max-height:250px;
    object-fit:contain;
    border-radius:10px;
    background:#eee;
}

.price{
    font-size:22px;
    font-weight:bold;
    color:#168a45;
    margin-top:8px;
}

.barcode{
    margin-top:8px;
    color:#555;
    word-break:break-all;
}

#scannerArea{
    display:none;
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

#reader{
    width:100%;
    max-width:450px;
    margin:auto;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}
</style>
</head>

<body>

<header>
<h1>🛒 গ্রোসারি বারকোড অ্যাপ</h1>
</header>

<main>

<div class="card">

<input

step="0.01"
placeholder="যেমন: 5"

<label>বারকোড</label>

<input
id="barcode"

placeholder="বারকোড নম্বর"
>

<button
type="button"
class="scan-btn"

>

</button>

<label>পণ্যের ছবি</label>

<input

type="file"

<button
type="button"
onclick="addProduct()"

</button>

</div>


<div id="scannerArea">

<h3 style="text-align:center;">

<div id="reader"></div>

<button
type="button"
onclick="stopScanner()"
style="background:#d93025;"
>
❌ স্ক্যান বন্ধ করুন
</button>

</div>


<div id="products"></div>

</main>
