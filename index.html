<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery Barcode App</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#222;
}

header{
  background:#168a45;
  color:white;
  text-align:center;
  padding:18px 10px;
}

header h1{
  margin:0;
  font-size:24px;
}

main{
  max-width:600px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.10);
}

label{
  display:block;
  margin-top:10px;
  margin-bottom:5px;
  font-weight:bold;
}

input,button{
  width:100%;
  padding:13px;
  border-radius:8px;
  font-size:16px;
}

input{
  border:1px solid #ccc;
}

button{
  border:0;
  background:#168a45;
  color:white;
  font-weight:bold;
  margin-top:12px;
}

button.delete{
  background:#d93025;
}

.product{
  text-align:center;
}

.product img{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #ddd;
}

.product h2{
  margin-bottom:5px;
}

.price{
  font-size:30px;
  color:#168a45;
  font-weight:bold;
  margin:10px;
}

.barcode{
  font-size:18px;
  background:#f1f1f1;
  padding:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
  <h1>গ্রোসারি বারকোড অ্যাপ</h1>
</header>

<main>

<div class="card">
  <h2>পণ্য যোগ করুন</h2>

  <label>পণ্যের নাম</label>
  <input id="name" type="text" placeholder="যেমন: Coca Cola">

  <label>পণ্যের দাম</label>
  <input id="price" type="number" placeholder="যেমন: 5">

  <label>বারকোড</label>
  <input id="barcode" type="text" placeholder="বারকোড নম্বর লিখুন">

  <label>পণ্যের ছবি</label>
  <input id="photo" type="file" accept="image/*">

  <button onclick="addProduct()">পণ্য যোগ করুন</button>
</div>

<div id="products"></div>

</main>

<script>
let products = JSON.parse(localStorage.getItem("products")) || [];

function saveProducts(){
  localStorage.setItem("products", JSON.stringify(products));
}

function addProduct(){

  const name = document.getElementById("name").value.trim();
  const price = document.getElementById("price").value.trim();
  const barcode = document.getElementById("barcode").value.trim();
  const photo = document.getElementById("photo").files[0];

  if(!name || !price || !barcode){
    alert("পণ্যের নাম, দাম এবং বারকোড দিন।");
    return;
  }

  if(photo){

    const reader = new FileReader();

    reader.onload = function(e){

      products.push({
        name:name,
        price:price,
        barcode:barcode,
        image:e.target.result
      });

      saveProducts();
      displayProducts();
      clearForm();
    };

    reader.readAsDataURL(photo);

  }else{

    products.push({
      name:name,
      price:price,
      barcode:barcode,
      image:""
    });

    saveProducts();
    displayProducts();
    clearForm();
  }
}

function displayProducts(){

  const container = document.getElementById("products");
  container.innerHTML = "";

  products.forEach(function(product,index){

    const div = document.createElement("div");
    div.className = "card product";

    div.innerHTML = `

      ${product.image
      ? `<img src="${product.image}" alt="পণ্যের ছবি">`
      : `<div style="padding:50px;background:#eee;border-radius:10px;">
           ছবি নেই
         </div>`
      }

      <h2>${product.name}</h2>

      <div class="price">
        ${product.price}
      </div>

      <div class="barcode">
        বারকোড: ${product.barcode}
      </div>

      <button class="delete" onclick="deleteProduct(${index})">
        পণ্য মুছুন
      </button>

    `;

    container.appendChild(div);
  });
}

function deleteProduct(index){

  if(confirm("এই পণ্যটি মুছে ফেলবেন?")){
    products.splice(index,1);
    saveProducts();
    displayProducts();
  }
}

function clearForm(){

  document.getElementById("name").value="";
  document.getElementById("price").value="";
  document.getElementById("barcode").value="";
  document.getElementById("photo").value="";
}

displayProducts();
</script>

</body>
</html>
