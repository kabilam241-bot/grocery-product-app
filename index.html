<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6}
header{background:#168a45;color:white;text-align:center;padding:18px}
.profile{width:110px;height:110px;object-fit:cover;border-radius:50%;border:4px solid white}
main{max-width:600px;margin:auto;padding:15px}
.card{background:white;padding:16px;margin-bottom:15px;border-radius:14px;box-shadow:0 2px 8px #ddd}
input,button{width:100%;padding:13px;margin-top:9px;border-radius:9px;font-size:16px;box-sizing:border-box}
input{border:1px solid #ccc}
button{border:0;background:#168a45;color:white;font-weight:bold}
.scan{background:#1769aa}
.delete{background:#d93025}
video{width:100%;margin-top:10px;border-radius:10px;display:none}
.product-photo{max-width:180px;max-height:180px;border-radius:12px}
.center{text-align:center}
.price{font-size:42px;color:#168a45;font-weight:bold;margin:12px 0}
.price-label{font-size:18px;color:#555}
</style>

<script>

function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 900;
    gain.gain.value = 0.18;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.18);
  }catch(e){}
}

async function scanBarcode(){
  let video = document.getElementById("video");
  video.style.display = "block";
  try{
    reader = new ZXingBrowser.BrowserMultiFormatReader();
    controls = await reader.decodeFromVideoDevice(
      undefined, video,
      (result,error) => {

          let code = result.getText();
          beep();
          document.getElementById("code").innerText = code;
          document.getElementById("barcode").value = code;
          document.getElementById("search").value = code;
