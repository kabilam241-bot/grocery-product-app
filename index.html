<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery Product App</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}
header{
  background:#198754;
  color:white;
  padding:18px 15px;
  text-align:center;
}
header h1{margin:0;font-size:24px}
.container{
  max-width:600px;
  margin:auto;
  padding:15px;
}
.card{
  background:white;
  padding:15px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #0001;
}
input,button{
  width:100%;
  padding:13px;
  margin:6px 0;
  border-radius:9px;
  border:1px solid #ddd;
  font-size:16px;
}
button{
  background:#198754;
  color:white;
  border:none;
  font-weight:bold;
}
button.delete{background:#dc3545}
button.edit{background:#0d6efd}
.product{
  display:flex;
  gap:12px;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:12px 0;
}
.product img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
}
.info{flex:1}
.name{
  font-size:18px;
  font-weight:bold;
}
.price{
  color:#198754;
  font-size:17px;
  font-weight:bold;
}
.barcode{
  font-size:13px;
  color:#777;
}
.actions{
  display:flex;
  gap:5px;
}
.actions button{
  width:auto;
  padding:8px 10px;
  margin:0;
  font-size:13px;
}
#preview{
  width:100%;
  max-height:220px;
  object-fit:contain;
  display:none;
  border-radius:10px;
  margin-top:8px;
}
.empty{
  text-align:center;
  color:#777;
  padding:25px;
}
</style>
</head>

<body>

<header>
  <h1>🛒 Grocery Product App</h1>
  <div>পণ্যের নাম • দাম • বারকোড • ছবি</div>
</header>

<div class="container">

<div class="card">
  <h2>➕ নতুন পণ্য</h2>

  <input id="name" type="text" placeholder="পণ্যের নাম">

  <input id="price" type="number" placeholder="দাম">

  <input id="barcode" type="text" placeholder="বারকোড">

  <input id="photo" type="file" accept="image/*">

  <img id="preview">

  <button onclick="saveProduct()">💾 পণ্য সংরক্ষণ করুন</button>
</div>

<div class="card">
  <input id="search" type="text"
         placeholder="🔍 নাম অথবা বারকোড দিয়ে খুঁজুন..."
         oninput="showProducts()">
</div>

<div class="card">
  <h2>📦 পণ্যের তালিকা</h2>
  <div id="products"></div>
</div>

</div>

<script>

let products = JSON.parse(localStorage.getItem("products")) || [];
let editId = null;

const photoInput = document.getElementById("photo");
const preview = document.getElementById("preview");

photoInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){
    photoData = e.target.result;
    preview.src = photoData;
    preview.style.display = "block";
  };

  reader.readAsDataURL(file);
});
